name: extract-empty

on:
  workflow_dispatch:
  workflow_run:
    workflows: [crawl]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: extract-empty
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - uses: actions/checkout@v4
        with:
          path: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Extraire les pages vides
        run: python main/scripts/extract_empty.py --data data --out data/empty/empty.jsonl
      - name: Commit
        run: |
          cd data
          git config user.name crawl-bot; git config user.email bot@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -qm "empty.jsonl update"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin data && git push -q origin data && break
            sleep 5
          done
