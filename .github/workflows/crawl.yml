name: crawl

on:
  workflow_dispatch:
    inputs:
      retry_errors:
        description: "Refaire aussi les URLs en erreur"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

env:
  SHARDS: 8

jobs:
  prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Créer la branche data si absente
        run: |
          if ! git ls-remote --exit-code --heads origin data >/dev/null; then
            git checkout --orphan data
            git rm -rf . >/dev/null
            git -c user.name=bot -c user.email=bot@users.noreply.github.com commit --allow-empty -m "init data"
            git push origin data
          fi

  crawl:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    concurrency:
      group: crawl-shard-${{ matrix.shard }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Crawl (avec commit de sauvegarde toutes les 10 min)
        run: |
          OUT="data/shard-${{ matrix.shard }}"
          save() {
            cd data
            git config user.name "crawl-bot"; git config user.email "bot@users.noreply.github.com"
            git add -A
            git diff --cached --quiet && { cd ..; return 0; }
            git commit -qm "shard ${{ matrix.shard }}: save $(date -u +%H:%M)"
            for i in 1 2 3 4 5; do
              git pull -q --rebase origin data && git push -q origin data && break
              sleep $((RANDOM % 10 + 3))
            done
            cd ..
          }
          python scripts/crawl.py --out "$OUT" --shard ${{ matrix.shard }} --shards $SHARDS \
            --max-minutes 335 ${{ inputs.retry_errors && '--retry-errors' || '' }} &
          PID=$!
          while kill -0 $PID 2>/dev/null; do
            for i in $(seq 60); do kill -0 $PID 2>/dev/null || break; sleep 10; done
            save
          done
          wait $PID
          save

  continue:
    needs: crawl
    if: always() && needs.crawl.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data
      - name: Relancer s'il reste des URLs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TOTAL=$(cat shard-*/remaining.txt 2>/dev/null | paste -sd+ | bc || echo 0)
          echo "restantes: ${TOTAL:-0}"
          if [ "${TOTAL:-0}" -gt 0 ]; then
            gh workflow run crawl.yml --repo ${{ github.repository }} --ref ${{ github.event.repository.default_branch }}
          fi
